# Package manifest — amalgame-mail-send
#
# Outbound SMTP delivery (the send path) for the native Amalgame mail
# server (Phase 6). Sender.Send delivers a message to a destination SMTP
# host over plaintext with opportunistic STARTTLS, optionally DKIM-signed
# (amalgame-mail-dkim). Complements amalgame-net-smtp (implicit-TLS :465
# submission client) — this targets MX :25 / submission :587 / smarthost.
#
# See Amalgame/docs/proposals/native-mail-server.md.
#
# Installation:
#   amc package add mail-send
#   amc package add github.com/amalgame-lang/amalgame-mail-send@v0.1.0

[package]
name              = "amalgame-mail-send"
version           = "0.1.0"
license           = "Apache-2.0"
description       = "Outbound SMTP delivery for the native Amalgame mail server: Sender.Send delivers a (optionally DKIM-signed) message to an SMTP host over plaintext + opportunistic STARTTLS. Targets MX :25 / submission :587 / smarthost."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.8.72"
schema-version    = 1

[dependencies]
amalgame-mail-dkim = ">=0.1.0"
amalgame-crypto    = ">=0.8.0"
amalgame-tls       = ">=0.3.5"

[stdlib]
class     = "Sender"
header    = "facade-stub.h"
namespace = "Amalgame.Mail.Send"
facade    = "facade.am"
libs      = []
